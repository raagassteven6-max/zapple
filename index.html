<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapple</title>

  <script>
    // Snapshot of every name this browser provides (window, document, fetch, ...).
    // It runs before any library loads, so libraries and this page's own functions
    // are not mistaken for browser built-ins.
    const BROWSER_GLOBALS = (() => {
      const names = new Set();
      for (let holder = window; holder && holder !== Object.prototype; holder = Object.getPrototypeOf(holder)) {
        Object.getOwnPropertyNames(holder).forEach((name) => names.add(name));
      }
      names.delete("constructor");
      return [...names];
    })();
  </script>

  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1c2128;
      --muted: #5c6673;
      --border: #cfd5dd;
      --accent: #1f4fc4;
      --ok: #11693f;
      --ok-bg: #e2f4ea;
      --error: #a8231b;
      --error-bg: #fcebe9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --panel: #1d232a;
        --text: #e6eaef;
        --muted: #97a1ad;
        --border: #35404b;
        --accent: #7ba3ff;
        --ok: #6fd6a0;
        --ok-bg: #163527;
        --error: #ff9b93;
        --error-bg: #3a1c1a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .subtitle { margin: 0 0 16px; color: var(--muted); }

    label { display: block; margin-bottom: 6px; font-weight: 600; }

    textarea {
      width: 100%;
      min-height: 260px;
      padding: 12px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      tab-size: 2;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 12px 0 16px;
    }

    select, button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    button { cursor: pointer; }

    button.primary {
      flex: 1;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }

    textarea:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .result {
      padding: 14px;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .result.ok    { background: var(--ok-bg);    color: var(--ok);    border-color: var(--ok); }
    .result.error { background: var(--error-bg); color: var(--error); border-color: var(--error); }

    .result-title { margin: 0 0 4px; font-weight: 700; }
    .result-detail { margin: 0 0 8px; color: var(--text); }

    .code-frame {
      margin: 0 0 12px;
      padding: 10px;
      overflow-x: auto;
      background: var(--panel);
      color: var(--text);
      border-radius: 4px;
      font: 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    .field { margin-top: 12px; }

    input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    input[type="text"]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .prompt-section { margin-top: 16px; }
    .prompt-box { min-height: 180px; font-size: 13px; }
    .prompt-section button.primary { width: 100%; margin-top: 8px; }

    .result + .result { margin-top: 12px; }
    .result.note { background: var(--panel); color: var(--text); border-color: var(--border); }

    .finding-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .finding {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      text-align: left;
    }

    .log { margin-top: 16px; }

    .log summary {
      display: flex;
      align-items: center;
      min-height: 44px;
      font-weight: 600;
      cursor: pointer;
    }

    .log-output {
      max-height: 280px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main>
    <h1>Zapple</h1>
    <p class="subtitle">Checks AI-written JavaScript before you use it</p>

    <label for="code-input">Paste code</label>
    <textarea id="code-input" spellcheck="false" autocapitalize="off" autocomplete="off"
              placeholder="Paste JavaScript here"></textarea>

    <div class="field">
      <label for="task-input">What should this code do? (optional)</label>
      <input id="task-input" type="text" autocomplete="off"
             placeholder="One sentence, included in the repair prompt">
    </div>

    <div class="field">
      <label for="globals-input">Extra names the code may use (optional)</label>
      <input id="globals-input" type="text" autocomplete="off" autocapitalize="off"
             placeholder="Names from libraries you load, like THREE, Chart">
    </div>

    <div class="controls">
      <select id="source-type" aria-label="Code type">
        <option value="module">Module (import / export)</option>
        <option value="script">Plain script</option>
      </select>
      <button id="clear-button" type="button">Clear</button>
      <button id="check-button" type="button" class="primary">Check</button>
    </div>

    <div id="result" aria-live="polite"></div>

    <details class="log">
      <summary>Log</summary>
      <pre id="log-output" class="code-frame log-output">Nothing has run yet.</pre>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.js"></script>
  <!-- ESLint's rule engine, bundled for browsers. Exposes the global `eslint`. -->
  <script src="https://cdn.jsdelivr.net/npm/eslint-linter-browserify@9/linter.js"></script>
  <script>
    "use strict";

    // ---------- Checking (no DOM code here) ----------

    /**
     * Parses `code` and reports whether it is valid JavaScript syntax.
     * Returns { ok: true } or { ok: false, problem: { message, line, column, sourceLine } }.
     */
    function checkSyntax(code, sourceType) {
      try {
        acorn.parse(code, { ecmaVersion: "latest", sourceType, locations: true });
        return { ok: true };
      } catch (error) {
        if (!(error instanceof SyntaxError) || !error.loc) throw error;
        return { ok: false, problem: describeProblem(error, code) };
      }
    }

    function describeProblem(error, code) {
      const { line, column } = error.loc;   // acorn: line starts at 1, column at 0
      return {
        // acorn appends " (line:column)" to its messages; we show the location separately
        message: error.message.replace(/\s*\(\d+:\d+\)$/, ""),
        line,
        column: column + 1,
        sourceLine: code.split("\n")[line - 1] ?? "",
      };
    }

    // ---------- Rule checks (no DOM code here) ----------

    // "error" problems are sent to the AI in the repair prompt.
    // "warn" notes are shown on screen only, so the AI is not asked to tidy code you didn't ask about.
    const ESLINT_RULES = {
      // Code that fails or behaves wrongly
      "no-undef": "error",
      "no-use-before-define": ["error", { functions: false, classes: false, variables: false }],
      "no-const-assign": "error",
      "no-redeclare": ["error", { builtinGlobals: false }],
      "no-dupe-keys": "error",
      "no-dupe-args": "error",
      "no-dupe-class-members": "error",
      "no-dupe-else-if": "error",
      "no-import-assign": "error",
      "no-unreachable": "error",
      "no-unsafe-negation": "error",
      "valid-typeof": "error",
      "use-isnan": "error",
      "getter-return": "error",
      "constructor-super": "error",
      "no-this-before-super": "error",
      // Banned patterns
      "no-eval": "error",
      // Housekeeping
      "no-unused-vars": ["warn", { vars: "local", args: "none" }],
    };

    const IDENTIFIER = /^[A-Za-z_$][\w$]*$/;

    /** "THREE, Chart  d3" -> ["THREE", "Chart", "d3"] (anything that isn't a valid name is dropped) */
    function parseNameList(text) {
      return text.split(/[\s,]+/).filter((name) => IDENTIFIER.test(name));
    }

    function buildLintConfig(sourceType, extraGlobals) {
      const names = [...BROWSER_GLOBALS, ...extraGlobals].filter((name) => IDENTIFIER.test(name));
      return {
        languageOptions: {
          ecmaVersion: "latest",
          sourceType,
          globals: Object.fromEntries(names.map((name) => [name, "readonly"])),
        },
        rules: ESLINT_RULES,
      };
    }

    function toFinding(message) {
      return {
        line: message.line,
        column: message.column,
        message: message.message,
        ruleId: message.ruleId,
        severity: message.severity === 2 ? "error" : "note",
      };
    }

    /**
     * Runs the ESLint rules on code that already passed the syntax check.
     * Returns { errors, notes }, each a list of { line, column, message, ruleId, severity }.
     */
    function lintCode({ code, sourceType, extraGlobals }) {
      const linter = new eslint.Linter({ configType: "flat" });
      const config = buildLintConfig(sourceType, extraGlobals);
      const findings = linter.verify(code, config, { filename: "input.js" }).map(toFinding);

      return {
        errors: findings.filter((finding) => finding.severity === "error"),
        notes: findings.filter((finding) => finding.severity === "note"),
      };
    }

    // ---------- Log ----------

    /** A running record of what Zapple does during a check, shown in the Log panel. */
    function createLog(outputElement) {
      let startedAt = performance.now();
      return {
        reset() {
          startedAt = performance.now();
          outputElement.textContent = "";
        },
        add(message) {
          const elapsed = Math.round(performance.now() - startedAt);
          outputElement.textContent += `[+${elapsed} ms] ${message}\n`;
        },
      };
    }

    // ---------- Sandbox: test-run the code (no DOM code here) ----------

    const RUN_TIMEOUT_MS = 3000;    // stop code that has not reached its last line by then
    const SETTLE_MS = 500;          // after the last line, wait for delayed errors (timers, promises)
    const MAX_OUTPUT_LINES = 200;

    // Names that only exist on a web page, so a worker cannot run code that uses them.
    const PAGE_ONLY_NAMES = new Set(["document", "window", "localStorage", "sessionStorage", "alert", "confirm", "prompt"]);

    /**
     * Runs first inside the worker (it is copied into the worker as text).
     * It captures console output, reports crashes, and blocks network and storage access.
     */
    function workerSetup() {
      const send = (message) => self.postMessage(message);

      const describe = (value) => {
        if (typeof value === "string") return value;
        if (value instanceof Error) return `${value.name}: ${value.message}`;
        try { return JSON.stringify(value) ?? String(value); } catch { return String(value); }
      };

      for (const level of ["log", "info", "warn", "error", "debug"]) {
        console[level] = (...args) => send({ type: "console", level, text: args.map(describe).join(" ") });
      }

      for (const name of ["fetch", "XMLHttpRequest", "WebSocket", "EventSource", "importScripts", "indexedDB", "caches"]) {
        Object.defineProperty(self, name, {
          get() { throw new Error(`${name} is blocked in the Zapple sandbox`); },
        });
      }

      const reportError = (error, line, column) => send({
        type: "error",
        name: error?.name ?? "Error",
        message: error?.message ?? String(error),
        stack: error?.stack ?? "",
        line,
        column,
      });

      self.addEventListener("error", (event) => {
        event.preventDefault();
        reportError(event.error ?? { message: event.message }, event.lineno, event.colno);
      });
      self.addEventListener("unhandledrejection", (event) => {
        event.preventDefault();
        reportError(event.reason);
      });
    }

    const WORKER_PREAMBLE = `(${workerSetup.toString()})();`;
    const PREAMBLE_LINES = WORKER_PREAMBLE.split("\n").length;   // user code starts on the next line

    function buildWorkerSource(code) {
      return `${WORKER_PREAMBLE}\n${code}\nself.postMessage({ type: "finished" });`;
    }

    /** The reason this code cannot be test-run yet, or null if it can. */
    function findSkipReason(code, sourceType) {
      for (const token of acorn.tokenizer(code, { ecmaVersion: "latest", sourceType })) {
        if (token.type === acorn.tokTypes._import) {
          return "the code uses import, which the sandbox does not support yet.";
        }
        if (token.type === acorn.tokTypes.name && PAGE_ONLY_NAMES.has(token.value)) {
          return `the code uses "${token.value}", which only exists on a web page.`;
        }
      }
      return null;
    }

    function skippedRun(reason) {
      return { status: "skipped", reason, errors: [], output: [], durationMs: 0 };
    }

    function runtimeFinding(message, line = null, column = null) {
      return { line, column, message, ruleId: "runtime", severity: "error" };
    }

    /** Line/column pairs found in an error's stack trace, in the order they appear. */
    function framesFromStack(stack) {
      return [...stack.matchAll(/blob:\S*?:(\d+):(\d+)/g)]
        .map(([, line, column]) => ({ line: Number(line), column: Number(column) }));
    }

    /** Turns a crash report from the worker into a finding, with the line mapped back to the user's code. */
    function toRuntimeFinding({ name, message, stack, line, column }) {
      const frames = [...(line ? [{ line, column }] : []), ...framesFromStack(stack)];
      const frame = frames.find((candidate) => candidate.line > PREAMBLE_LINES);   // skip Zapple's own setup lines
      const text = `${name}: ${message}`;
      return frame ? runtimeFinding(text, frame.line - PREAMBLE_LINES, frame.column) : runtimeFinding(text);
    }

    /**
     * Runs `code` in a Web Worker and reports what happened.
     * Resolves with { status, errors, output, durationMs, reason? }.
     * status: "finished" | "crashed" | "timeout" | "skipped"
     */
    function runInSandbox({ code, sourceType, log }) {
      const skipReason = findSkipReason(code, sourceType);
      if (skipReason) return Promise.resolve(skippedRun(skipReason));

      return new Promise((resolve) => {
        const startedAt = performance.now();
        const output = [];
        const errors = [];
        const url = URL.createObjectURL(new Blob([buildWorkerSource(code)], { type: "text/javascript" }));
        const worker = new Worker(url, { type: sourceType === "module" ? "module" : "classic" });
        let timeoutTimer = null;
        let settleTimer = null;

        function finish(status) {
          clearTimeout(timeoutTimer);
          clearTimeout(settleTimer);
          worker.terminate();
          URL.revokeObjectURL(url);
          const durationMs = Math.round(performance.now() - startedAt);
          log.add(`Sandbox result: ${status} (${durationMs} ms)`);
          resolve({ status, errors, output, durationMs });
        }

        function recordCrash(finding) {
          errors.push(finding);
          log.add(`Crash: ${finding.message}${finding.line ? ` (line ${finding.line})` : ""}`);
          finish("crashed");
        }

        worker.onmessage = ({ data }) => {
          if (data.type === "console" && output.length < MAX_OUTPUT_LINES) {
            output.push(data.level === "log" ? data.text : `[${data.level}] ${data.text}`);
            log.add(`console.${data.level}: ${data.text}`);
          } else if (data.type === "error") {
            recordCrash(toRuntimeFinding(data));
          } else if (data.type === "finished") {
            log.add("Code reached its last line; waiting for delayed errors");
            settleTimer = setTimeout(() => finish("finished"), SETTLE_MS);
          }
        };

        // Fires when the worker cannot start at all (for example, a browser without module workers)
        worker.onerror = (event) => {
          event.preventDefault();
          recordCrash(runtimeFinding(`The sandbox could not run the code: ${event.message || "unknown error"}`));
        };

        timeoutTimer = setTimeout(() => {
          errors.push(runtimeFinding(
            `The code did not finish within ${RUN_TIMEOUT_MS / 1000} seconds (possible infinite loop or endless wait)`
          ));
          log.add("Timeout: the code did not reach its last line");
          finish("timeout");
        }, RUN_TIMEOUT_MS);

        log.add(`Sandbox started (limit ${RUN_TIMEOUT_MS / 1000} s)`);
      });
    }

    // ---------- Repair prompt (no DOM code here) ----------

    const CONTEXT_LINES = 3;   // lines shown above and below the error

    const REPLY_RULE = "- Reply with only the complete corrected code in one code block. No explanation.";

    const SYNTAX_FIX_RULES = [
      "Rules:",
      "- Fix only this error. Do not rewrite, rename, reformat, or add features.",
      "- If you spot other syntax errors, fix those too, and change nothing else.",
      REPLY_RULE,
    ];

    const LINT_FIX_RULES = [
      "Rules:",
      "- Fix every problem listed and change nothing else. Do not rewrite, rename, reformat, or add features.",
      "- For a name that is not defined, either define it or use the correct name that already exists in the code. Do not delete the code that uses it.",
      "- Problems marked [runtime] crashed when the code was run. Fix the cause of the crash.",
      REPLY_RULE,
    ];

    /** Numbered lines around the error, with ">" marking the bad one. */
    function buildContext(code, errorLine) {
      const lines = code.split("\n");
      const first = Math.max(1, errorLine - CONTEXT_LINES);
      const last = Math.min(lines.length, errorLine + CONTEXT_LINES);
      const width = String(last).length;

      const rows = [];
      for (let number = first; number <= last; number++) {
        const marker = number === errorLine ? ">" : " ";
        rows.push(`${marker} ${String(number).padStart(width)} | ${lines[number - 1]}`);
      }
      return rows.join("\n");
    }

    /** A code fence longer than any backtick run inside the code, so the code can't break out of it. */
    function fenceFor(code) {
      const longestRun = (code.match(/`+/g) ?? []).reduce((max, run) => Math.max(max, run.length), 0);
      return "`".repeat(Math.max(3, longestRun + 1));
    }

    /** The parts every repair prompt shares; each check supplies its own intro, details and rules. */
    function assemblePrompt({ intro, task, sourceType, details, rules, code }) {
      const fence = fenceFor(code);
      const sections = [
        intro,
        task ? `What the code should do: ${task}` : null,
        `Code type: ${sourceType === "module" ? "ES module" : "plain script"}`,
        details,
        rules.join("\n"),
        `Full code:\n${fence}js\n${code}\n${fence}`,
      ];
      return sections.filter(Boolean).join("\n\n");
    }

    function buildSyntaxPrompt({ code, problem, sourceType, task }) {
      const details = [
        `Error: ${problem.message} (line ${problem.line}, column ${problem.column})`,
        `Code around the error (">" marks the line):\n${buildContext(code, problem.line)}`,
      ].join("\n\n");

      return assemblePrompt({
        intro: "Fix the syntax error in the JavaScript below.",
        task, sourceType, details, code,
        rules: SYNTAX_FIX_RULES,
      });
    }

    function buildLintPrompt({ code, errors, sourceType, task }) {
      const lines = code.split("\n");
      const problems = errors.map((finding, index) => {
        const rule = finding.ruleId ? ` [${finding.ruleId}]` : "";
        const place = finding.line ? `Line ${finding.line}, column ${finding.column}: ` : "";
        const heading = `${index + 1}. ${place}${finding.message}${rule}`;
        const source = finding.line ? `\n   > ${(lines[finding.line - 1] ?? "").trim()}` : "";
        return heading + source;
      });

      return assemblePrompt({
        intro: "Fix the problems found in the JavaScript below.",
        task, sourceType, code,
        details: `Problems found:\n${problems.join("\n")}`,
        rules: LINT_FIX_RULES,
      });
    }

    // ---------- Display ----------

    const codeInput   = document.getElementById("code-input");
    const sourceType  = document.getElementById("source-type");
    const taskInput   = document.getElementById("task-input");
    const globalsInput = document.getElementById("globals-input");
    const resultPanel = document.getElementById("result");
    const checkButton = document.getElementById("check-button");
    const log = createLog(document.getElementById("log-output"));

    /** Creates an element with optional class and text (textContent keeps pasted code inert). */
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showResult(...nodes) {
      resultPanel.replaceChildren(...nodes);
    }

    function buildMessageBox(kind, title, detail) {
      const box = el("div", `result ${kind}`);
      box.append(el("p", "result-title", title));
      if (detail) box.append(el("p", "result-detail", detail));
      return box;
    }

    function showMessage(kind, title, detail) {
      showResult(buildMessageBox(kind, title, detail));
    }

    /** Shows the bad line with a caret under the problem column. */
    function buildCodeFrame({ line, column, sourceLine }) {
      const gutter = `${line} | `;
      // Keep tabs as tabs so the caret lines up with the code above it
      const padding = sourceLine.slice(0, column - 1).replace(/[^\t]/g, " ");
      const caretLine = " ".repeat(gutter.length) + padding + "^";
      return el("pre", "code-frame", `${gutter}${sourceLine}\n${caretLine}`);
    }

    function showSyntaxError(problem, promptText) {
      const box = el("div", "result error");
      const jumpButton = el("button", "", `Go to line ${problem.line}`);
      jumpButton.type = "button";
      jumpButton.addEventListener("click", () => selectLine(problem.line));

      box.append(
        el("p", "result-title", "Syntax error"),
        el("p", "result-detail", `${problem.message} (line ${problem.line}, column ${problem.column})`),
        buildCodeFrame(problem),
        jumpButton
      );
      showResult(box, buildPromptSection(promptText));
    }

    /** The repair prompt in a read-only box, with a button that copies it. */
    function buildPromptSection(promptText) {
      const label = el("label", "", "Repair prompt");
      label.htmlFor = "prompt-output";

      const promptBox = el("textarea", "prompt-box");
      promptBox.id = "prompt-output";
      promptBox.readOnly = true;
      promptBox.value = promptText;

      const copyButton = el("button", "primary", "Copy repair prompt");
      copyButton.type = "button";
      copyButton.addEventListener("click", () => copyPrompt(promptBox, copyButton));

      const section = el("div", "prompt-section");
      section.append(label, promptBox, copyButton);
      return section;
    }

    async function copyPrompt(promptBox, button) {
      try {
        await navigator.clipboard.writeText(promptBox.value);
        flashLabel(button, "Copied");
      } catch {
        // Clipboard blocked: select the text so it can be copied by hand
        promptBox.focus();
        promptBox.select();
        flashLabel(button, "Selected. Copy it manually");
      }
    }

    /** Shows a message on a button for two seconds, then restores its label. */
    function flashLabel(button, message) {
      const original = button.textContent;
      button.textContent = message;
      setTimeout(() => { button.textContent = original; }, 2000);
    }

    function countLabel(count, noun) {
      return `${count} ${noun}${count === 1 ? "" : "s"}`;
    }

    /** One tappable row per finding; tapping jumps to that line in the code box. */
    function buildFindingList(findings) {
      const list = el("ul", "finding-list");
      for (const finding of findings) {
        const label = finding.line ? `Line ${finding.line}: ${finding.message}` : finding.message;
        const row = el("button", "finding", label);
        row.type = "button";
        if (finding.line) row.addEventListener("click", () => selectLine(finding.line));
        const item = el("li");
        item.append(row);
        list.append(item);
      }
      return list;
    }

    function buildFindingsBox(kind, title, findings) {
      const box = el("div", `result ${kind}`);
      box.append(el("p", "result-title", title), buildFindingList(findings));
      return box;
    }

    function describeRunOutcome(run) {
      return run.status === "skipped"
        ? `No errors found. Not run: ${run.reason}`
        : `No errors found. The code ran without crashing (${run.durationMs} ms).`;
    }

    function buildOutputBox(output) {
      const box = el("div", "result note");
      box.append(el("p", "result-title", "Console output"), el("pre", "code-frame", output.join("\n")));
      return box;
    }

    /** Shows errors (with the repair prompt), notes, and what the code printed during the test run. */
    function showReport({ errors, notes, run, promptText }) {
      const blocks = [];

      if (errors.length === 0) {
        blocks.push(buildMessageBox("ok", "OK", describeRunOutcome(run)));
      } else {
        blocks.push(buildFindingsBox("error", countLabel(errors.length, "problem"), errors));
      }
      if (notes.length > 0) {
        blocks.push(buildFindingsBox("note", countLabel(notes.length, "note"), notes));
      }
      if (run.output.length > 0) {
        blocks.push(buildOutputBox(run.output));
      }
      if (promptText) {
        blocks.push(buildPromptSection(promptText));
      }
      showResult(...blocks);
    }

    /** Highlights a line inside the textarea so it can be fixed right away. */
    function selectLine(lineNumber) {
      const lines = codeInput.value.split("\n");
      const start = lines.slice(0, lineNumber - 1).reduce((sum, text) => sum + text.length + 1, 0);
      codeInput.focus();
      codeInput.setSelectionRange(start, start + lines[lineNumber - 1].length);
    }

    // ---------- Wiring ----------

    async function handleCheck() {
      if (typeof acorn === "undefined") {
        showMessage("error", "Parser not loaded", "Check your internet connection and reload the page.");
        return;
      }
      if (codeInput.value.trim() === "") {
        showMessage("error", "Nothing to check", "Paste some code first.");
        return;
      }

      log.reset();
      const request = {
        code: codeInput.value,
        sourceType: sourceType.value,
        task: taskInput.value.trim(),
        extraGlobals: parseNameList(globalsInput.value),
      };
      log.add(`Check started: ${request.sourceType}, ${countLabel(request.code.split("\n").length, "line")}`);

      const syntax = checkSyntax(request.code, request.sourceType);
      if (!syntax.ok) {
        log.add(`Syntax check: error at line ${syntax.problem.line}`);
        showSyntaxError(syntax.problem, buildSyntaxPrompt({ ...request, problem: syntax.problem }));
        return;
      }
      log.add("Syntax check: passed");

      if (typeof eslint === "undefined") {
        log.add("Rule check: could not load ESLint");
        showMessage("error", "Rule checker not loaded",
          "The syntax is valid, but the rule checker could not load. Check your internet connection and reload the page.");
        return;
      }

      const lint = lintCode(request);
      log.add(`Rule check: ${countLabel(lint.errors.length, "error")}, ${countLabel(lint.notes.length, "note")}`);

      // Only test-run code that has no rule errors, so the same problem is not reported twice
      const run = lint.errors.length === 0
        ? await runInSandbox({ ...request, log })
        : skippedRun("fix the rule errors first.");
      if (run.status === "skipped") log.add(`Sandbox skipped: ${run.reason}`);

      const errors = [...lint.errors, ...run.errors];
      const promptText = errors.length > 0 ? buildLintPrompt({ ...request, errors }) : null;
      showReport({ errors, notes: lint.notes, run, promptText });
    }

    function handleClear() {
      codeInput.value = "";
      showResult();
      log.reset();
      codeInput.focus();
    }

    checkButton.addEventListener("click", async () => {
      checkButton.disabled = true;   // no second run while the sandbox is busy
      try {
        await handleCheck();
      } catch (error) {
        log.add(`Unexpected error: ${error.message}`);
        showMessage("error", "Something went wrong", error.message);
      } finally {
        checkButton.disabled = false;
      }
    });
    document.getElementById("clear-button").addEventListener("click", handleClear);
  </script>
</body>
</html>
