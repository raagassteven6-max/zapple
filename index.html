<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapple</title>

  <script src="browser-globals.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Zapple</h1>
    <p class="subtitle">Checks AI-written JavaScript before you use it</p>

    <label for="code-input">Paste code</label>
    <textarea id="code-input" spellcheck="false" autocapitalize="off" autocomplete="off"
              placeholder="Paste JavaScript here"></textarea>

    <div class="field">
      <label for="task-input">What should this code do? (optional)</label>
      <input id="task-input" type="text" autocomplete="off"
             placeholder="One sentence, included in the repair prompt">
    </div>

    <div class="field">
      <label for="globals-input">Extra names the code may use (optional)</label>
      <input id="globals-input" type="text" autocomplete="off" autocapitalize="off"
             placeholder="Names from libraries you load, like THREE, Chart">
    </div>

    <div class="field">
      <label id="checks-label" for="checks-input">Checks (optional): one JavaScript expression per line</label>
      <textarea id="checks-input" class="checks-box" spellcheck="false" autocapitalize="off"
                placeholder="add(2, 3) === 5"></textarea>
    </div>

    <div class="controls">
      <select id="language" aria-label="Language">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
      </select>
      <button id="clear-button" type="button">Clear</button>
      <button id="check-button" type="button" class="primary">Check</button>
    </div>

    <div id="result" aria-live="polite"></div>

    <details class="log">
      <summary>Log</summary>
      <pre id="log-output" class="code-frame log-output">Nothing has run yet.</pre>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.js"></script>
  <!-- ESLint's rule engine, bundled for browsers. Exposes the global `eslint`. -->
  <script src="https://cdn.jsdelivr.net/npm/eslint-linter-browserify@9.37.0/linter.js"></script>
  <script src="checks.js"></script>
  <script src="ui.js"></script>
</body>
</html>
