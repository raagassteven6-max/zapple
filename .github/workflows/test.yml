name: Test checks.js

# Runs the Zapple test suite on every push and pull request. It does not change the website:
# GitHub Pages keeps serving the same files. Open the Actions tab to see results.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest      # Node 22 and Python 3.12 come preinstalled on this image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # the version Pyodide runs in the browser

      - name: Install dependencies
        run: |
          node --version
          python --version
          npm install --no-audit --no-fund
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: JavaScript checks (acorn + ESLint)
        run: npm run test:js

      - name: Python checks (real pyflakes)
        run: npm run test:py

      - name: Sandbox in a real browser (Chromium)
        run: npm run test:sandbox

      - name: Page in a real browser (Chromium)
        run: npm run test:ui

      - name: Python worker library loading (fake Pyodide)
        run: npm run test:pyworker

  # Separate job so a slow or unreachable CDN never hides the results above.
  real-pyodide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Real Pyodide with numpy and pandas
        run: npm run test:pyodide
